# Checks the backend. Separate from the Pages workflow so a server problem does
# not block the frontend demo from deploying.
name: Server checks

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**']
  workflow_dispatch:

jobs:
  # Static: does the schema parse, and does it satisfy the tenancy invariants.
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check

  # Live: do the migrations actually apply, and do the policies actually hold.
  #
  # Against a real PostgreSQL, because parsing is not execution — it cannot
  # catch a type mismatch, a missing function, or a policy that is written
  # correctly and does nothing.
  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: peoplehub
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      # The owner, for migrations. No TLS: this is a container on the same
      # host, not a connection across a network.
      MIGRATE_DATABASE_URL: postgresql://postgres:ci@localhost:5432/peoplehub
      PGSSLMODE: disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci

      # Stand in for the parts of Supabase the schema depends on.
      - run: npm run ci:bootstrap

      - name: Apply migrations
        run: npm run migrate

      # Seeding is how a real database goes from empty to usable, so it is
      # tested rather than assumed. Run twice: the second run proves it is
      # idempotent, which is what makes it safe to re-run after adding a
      # department without duplicating the other eight.
      - name: Seed, twice
        run: |
          npm run seed -- --admin ci@example.test
          npm run seed -- --admin ci@example.test

      # app_rw is created NOLOGIN by the migration; give it a password so the
      # isolation test can connect as a role that cannot bypass RLS.
      - name: Give app_rw a login
        run: |
          node -e "
            const pg = require('pg');
            (async () => {
              const c = new pg.Client({ connectionString: process.env.MIGRATE_DATABASE_URL });
              await c.connect();
              await c.query(\"ALTER ROLE app_rw LOGIN PASSWORD 'ci'\");
              await c.end();
            })();
          "

      - name: Prove tenant isolation
        env:
          DATABASE_URL: postgresql://app_rw:ci@localhost:5432/peoplehub
        run: npm run verify:isolation

      # The behavioural suites, against a real database.
      #
      # All eleven. They existed and ran nowhere: each skips itself when
      # DATABASE_URL and MIGRATE_DATABASE_URL are unset, which is every
      # environment except a developer's laptop, so 488 assertions about how the
      # services actually behave were written, run once by hand, and then
      # guarded nothing. This job already had the database they needed — it was
      # standing one up for the migrations and the isolation check and then
      # throwing it away.
      #
      # What makes them safe to run against a seeded database is that the ones
      # which write build a scratch tenant, work inside it, and drop it in a
      # single DELETE that cascades through all 126 tenant-scoped tables. Each
      # proves that at the end by comparing the surrounding row counts before and
      # after; after a full pass the seeded tenant is untouched and no scratch
      # tenant or ZZ-prefixed employee remains.
      #
      # TEST_ADMIN_CODE and TEST_TENANT_SLUG point the suites at what this job
      # seeded. Their defaults are the live tenant's own '360vhm' and 'VHM004',
      # so a developer's run against production is unchanged; here they name the
      # seed's admin, which is VHM001 unless `--code` says otherwise.
      #
      # Ordered cheapest-first within reason, so a broken schema fails before
      # the 117-assertion suite spends two minutes proving it.
      - name: Behavioural suites
        env:
          MIGRATE_DATABASE_URL: postgresql://postgres:ci@localhost:5432/peoplehub
          DATABASE_URL: postgresql://app_rw:ci@localhost:5432/peoplehub
          # config.ts has exactly two hard requirements, DATABASE_URL and this,
          # and the suites import the service layer, so `config.ts` loads and
          # throws before a single assertion runs without it.
          #
          # Inert here. It is used only to build the JWKS URL, and nothing in
          # these suites makes an HTTP request — the one that would, the
          # invitation path, has its provider replaced by a stub. `pages.yml`
          # passes the same ci.invalid to check:gate for the same reason.
          #
          # This is what the first real CI run caught and a laptop could not:
          # server/.env supplies SUPABASE_URL locally and is git-ignored, so the
          # suites passed 488/488 on a developer's machine while the step itself
          # had never been proven to carry what they need.
          SUPABASE_URL: https://ci.invalid
          # And the redirect an invitation link points at. inviteRedirect()
          # throws without it — correctly, since an invitation with nowhere to
          # send anybody is not an invitation — which failed four assertions in
          # check:invite and stopped check:hierarchy outright. Inert: the
          # provider is stubbed in these suites, so no link is ever followed.
          APP_BASE_URL: https://ci.invalid
          # Not a key, and deliberately not empty. check:invite asserts that no
          # audit row leaks it, as `!blob.includes(secret)` — and an unset
          # variable makes that needle the empty string, which every string
          # contains, so the assertion inverts and fails unconditionally. A
          # recognisable non-secret keeps it a real check: this value must never
          # appear in an audit row either.
          SUPABASE_SERVICE_ROLE_KEY: ci-not-a-real-service-role-key
          TEST_ADMIN_CODE: VHM001
          TEST_TENANT_SLUG: '360vhm'
        run: |
          npm run check:tenancy
          npm run check:claim
          npm run check:profile
          npm run check:kb
          npm run check:survey
          npm run check:departments
          npm run check:invite
          npm run check:payrollprereq
          npm run check:projects
          npm run check:hierarchy
          npm run check:employment

      # A suite that cannot reach the database skips itself and exits 0, which is
      # indistinguishable from passing. That is acceptable on a laptop and not
      # here, because this job exists to be the place these actually run: a
      # typo in a connection string above would turn all eleven into silent
      # no-ops and the job would still be green.
      #
      # So the absence of a skip is asserted, rather than assumed.
      - name: No suite silently skipped
        env:
          MIGRATE_DATABASE_URL: postgresql://postgres:ci@localhost:5432/peoplehub
          DATABASE_URL: postgresql://app_rw:ci@localhost:5432/peoplehub
          SUPABASE_URL: https://ci.invalid
          # And the redirect an invitation link points at. inviteRedirect()
          # throws without it — correctly, since an invitation with nowhere to
          # send anybody is not an invitation — which failed four assertions in
          # check:invite and stopped check:hierarchy outright. Inert: the
          # provider is stubbed in these suites, so no link is ever followed.
          APP_BASE_URL: https://ci.invalid
          # Not a key, and deliberately not empty. check:invite asserts that no
          # audit row leaks it, as `!blob.includes(secret)` — and an unset
          # variable makes that needle the empty string, which every string
          # contains, so the assertion inverts and fails unconditionally. A
          # recognisable non-secret keeps it a real check: this value must never
          # appear in an audit row either.
          SUPABASE_SERVICE_ROLE_KEY: ci-not-a-real-service-role-key
          TEST_ADMIN_CODE: VHM001
          TEST_TENANT_SLUG: '360vhm'
        run: |
          set -e
          for s in tenancy claim profile kb survey departments invite \
                   payrollprereq projects hierarchy employment; do
            if npm run --silent "check:$s" | grep -q SKIPPED; then
              echo "check:$s skipped itself — it did not reach the database"
              exit 1
            fi
          done
          echo "all eleven suites reached the database"
