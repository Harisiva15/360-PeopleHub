# Checks the backend schema and skeleton. Separate from the Pages workflow so a
# server problem does not block the frontend demo from deploying.
name: Server checks

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Schema invariants, the checker's own tests, and the TypeScript.
      - run: npm run check
