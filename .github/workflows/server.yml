# Checks the backend. Separate from the Pages workflow so a server problem does
# not block the frontend demo from deploying.
name: Server checks

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**']
  workflow_dispatch:

jobs:
  # Static: does the schema parse, and does it satisfy the tenancy invariants.
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check

  # Live: do the migrations actually apply, and do the policies actually hold.
  #
  # Against a real PostgreSQL, because parsing is not execution — it cannot
  # catch a type mismatch, a missing function, or a policy that is written
  # correctly and does nothing.
  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: peoplehub
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      # The owner, for migrations. No TLS: this is a container on the same
      # host, not a connection across a network.
      MIGRATE_DATABASE_URL: postgresql://postgres:ci@localhost:5432/peoplehub
      PGSSLMODE: disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci

      # Stand in for the parts of Supabase the schema depends on.
      - run: npm run ci:bootstrap

      - name: Apply migrations
        run: npm run migrate

      # Seeding is how a real database goes from empty to usable, so it is
      # tested rather than assumed. Run twice: the second run proves it is
      # idempotent, which is what makes it safe to re-run after adding a
      # department without duplicating the other eight.
      - name: Seed, twice
        run: |
          npm run seed -- --admin ci@example.test
          npm run seed -- --admin ci@example.test

      # app_rw is created NOLOGIN by the migration; give it a password so the
      # isolation test can connect as a role that cannot bypass RLS.
      - name: Give app_rw a login
        run: |
          node -e "
            const pg = require('pg');
            (async () => {
              const c = new pg.Client({ connectionString: process.env.MIGRATE_DATABASE_URL });
              await c.connect();
              await c.query(\"ALTER ROLE app_rw LOGIN PASSWORD 'ci'\");
              await c.end();
            })();
          "

      - name: Prove tenant isolation
        env:
          DATABASE_URL: postgresql://app_rw:ci@localhost:5432/peoplehub
        run: npm run verify:isolation

      # Every suite that needs a database, run here because here is the only
      # place one exists.
      #
      # This used to name eleven, and there are twenty-five. The other thirteen
      # were added over the phases that built business units, legal entities,
      # the tenant profile, shifts, work schedules and the calendar — and each
      # skips itself when DATABASE_URL and MIGRATE_DATABASE_URL are unset, which
      # is every environment except a developer's laptop. So roughly a thousand
      # assertions about how the services actually behave were written, run once
      # by hand, and then guarded nothing. The job was already standing up the
      # database they needed and throwing it away.
      #
      # A suite that cannot reach the database skips itself and exits 0, which
      # is indistinguishable from passing. That is acceptable on a laptop and
      # not here, because this step exists to be the place these actually run: a
      # typo in a connection string above would turn all twenty-four into
      # silent no-ops and the job would still be green. So the absence of a skip
      # is asserted rather than assumed — and asserted in the same pass that
      # runs them, rather than by running all of them a second time, which is
      # what the separate guard step used to do.
      #
      # What makes them safe against a seeded database is that the ones which
      # write build a scratch tenant, work inside it, and drop it in a single
      # DELETE that cascades through every tenant-scoped table. Each proves that
      # at the end by comparing the surrounding row counts; after a full pass the
      # seeded tenant is untouched and no scratch tenant remains.
      - name: Behavioural suites, and none of them skipped
        env:
          MIGRATE_DATABASE_URL: postgresql://postgres:ci@localhost:5432/peoplehub
          DATABASE_URL: postgresql://app_rw:ci@localhost:5432/peoplehub
          # config.ts has exactly two hard requirements, DATABASE_URL and this,
          # and the suites import the service layer, so `config.ts` loads and
          # throws before a single assertion runs without it.
          #
          # Inert here. It is used only to build the JWKS URL, and nothing in
          # these suites makes an HTTP request — the one that would, the
          # invitation path, has its provider replaced by a stub.
          SUPABASE_URL: https://ci.invalid
          # And the redirect an invitation link points at. inviteRedirect()
          # throws without it — correctly, since an invitation with nowhere to
          # send anybody is not an invitation.
          APP_BASE_URL: https://ci.invalid
          # Not a key, and deliberately not empty. check:invite asserts that no
          # audit row leaks it, as `!blob.includes(secret)` — and an unset
          # variable makes that needle the empty string, which every string
          # contains, so the assertion inverts and fails unconditionally.
          SUPABASE_SERVICE_ROLE_KEY: ci-not-a-real-service-role-key
          TEST_ADMIN_CODE: VHM001
          TEST_TENANT_SLUG: '360vhm'
        run: |
          set -euo pipefail
          failed=0
          for s in migrationstate claim profile kb survey departments deptbu depthierarchy businessunits legalentities tenantprofile projects invite hierarchy employment payrollprereq shifts workingdays workschedule schedules calschedules punch provisioning expectedactual leavealign; do
            echo "::group::check:$s"
            if ! out=$(npm run --silent "check:$s" 2>&1); then
              echo "$out"
              echo "::error::check:$s failed"
              failed=1
            elif grep -q SKIPPED <<<"$out"; then
              echo "$out"
              echo "::error::check:$s skipped itself — it did not reach the database"
              failed=1
            else
              echo "$out" | tail -3
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "one or more database suites failed or skipped"
            exit 1
          fi
          echo "all 25 database suites reached the database and passed"
