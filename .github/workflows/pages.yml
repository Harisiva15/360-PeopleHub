# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the default token is read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gates that run locally. A red build should not reach the URL.
      #
      # `check:all` rather than a list of its parts: the list had already
      # drifted — it was missing the role, coverage and contrast checks, so
      # three gates that fail locally would still have deployed.
      - name: Typecheck, lint and checks
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx oxlint
          npm run check:all
          # Proves the sign-in gate is closed. Needs a configured build, so it
          # runs with placeholder credentials — nothing connects to Supabase,
          # because the render never gets that far. This is the one check the
          # local suite cannot make, which is why it is named separately.
          VITE_SUPABASE_URL=https://ci.invalid VITE_SUPABASE_PUBLISHABLE_KEY=ci npm run check:gate

      - name: Build
        # No BASE_PATH: the site is served from the root of its own domain.
        #
        # This used to set `/<repo>/`, which is right for a project site at
        # harisiva15.github.io/360-PeopleHub/ and wrong the moment a custom
        # domain is attached. Every asset was requested from
        # 360peoplehub.com/360-PeopleHub/assets/… — a path that does not exist
        # there — so the HTML loaded, every script and stylesheet 404'd, and
        # the page rendered blank with no error of its own.
        #
        # `vite.config.ts` still honours BASE_PATH, so a project-site build is
        # one variable away if this ever needs to serve from a sub-path again.
        #
        # These three decide whether the build is the product or the demo.
        # `authConfigured` (src/auth/supabase.ts) and `apiConfigured`
        # (src/services/http/client.ts) are computed from them, and between
        # them they control the sign-in gate, the DEMO badge, the role
        # switcher, and whether 325 service methods reach the API or the
        # in-memory dataset. With none of them set the deploy is a demo — which
        # is a legitimate thing to publish, and was what this workflow built.
        #
        # All three are browser-safe. The publishable key is the anon key: it
        # is meant to ship, and every request it makes is still subject to
        # row-level security. Nothing server-side belongs here, and
        # checks/auth-gate.tsx fails the build if a VITE_ variable is ever
        # named for a secret.
        #
        # Read from `secrets`, which is where these are stored. `vars` and
        # `secrets` are separate namespaces and an unset one is an empty
        # string, not an error — so reading the wrong one produces a build that
        # succeeds, deploys, and is silently still the demo. That is worth
        # knowing if these ever move: change both the storage and this line.
        #
        # Masking is the only real difference here. These three end up in the
        # bundle by design, so hiding them in the log protects nothing; it just
        # means you cannot read back what you set. Either namespace works.
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # enablement turns Pages on with the workflow's own token, so nobody has
      # to flip a switch in Settings for the first deploy to land.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
