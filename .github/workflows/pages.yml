# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the default token is read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gates that run locally. A red build should not reach the URL.
      - name: Typecheck, lint and checks
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx oxlint
          npm run check
          npm run check:routes
          # Proves the sign-in gate is closed. Needs a configured build, so it
          # runs with placeholder credentials — nothing connects to Supabase,
          # because the render never gets that far.
          VITE_SUPABASE_URL=https://ci.invalid VITE_SUPABASE_ANON_KEY=ci npm run check:gate

      - name: Build
        # A project site is served from /<repo>/, not the domain root.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # enablement turns Pages on with the workflow's own token, so nobody has
      # to flip a switch in Settings for the first deploy to land.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
